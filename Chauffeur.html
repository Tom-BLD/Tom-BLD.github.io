
<script>
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');

function loadData() {
    fetch("https://TONSITE.sharepoint.com/sites/TONSITE/_api/web/lists/getbytitle('Arriveeschauffeurs')/items")
    .then(res => res.json())
    .then(data => {
        const item = data.value.find(x => x.ID == id);

        if (!item || !item.Quai) {
            document.getElementById("result").innerHTML = "Merci de patienter...";
        } else {
            document.getElementById("result").innerHTML =
                "Quai : " + item.Quai + "<br>Code : " + item.Code;
        }
    });
}

loadData();
setInterval(loadData, 3000);
</script>
