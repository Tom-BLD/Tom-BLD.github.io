
<script>
setInterval(() => {
    fetch('data.json')
    .then(res => res.json())
    .then(data => {
        if (!data.quai) {
            document.getElementById("result").innerHTML = "Merci de patienter...";
        } else {
            document.getElementById("result").innerHTML =
                "Quai : " + data.quai + "<br>Code : " + data.code;
        }
    });
}, 3000);
</script>
